repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs from the project venv (uv.lock-pinned) as a local system hook so
  # pre-commit and CI resolve identical versions and dependencies by construction.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy --strict torbox
        language: system
        pass_filenames: false
        types: [python]

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick
        entry: pytest -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: false
