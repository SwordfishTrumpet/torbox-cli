name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Needed for hatch-vcs to read tags

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Pinned to the version that wrote `uv.lock` (see AGENTS.md).
          version: "0.12.19"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          uv build
          # `uv build` seeds dist/ with a .gitignore; the release must not
          # publish it (issue #53).
          rm -f dist/.gitignore

      - name: Export pinned dependency requirements from lockfile
        run: uv export --frozen -o requirements.lock.txt

      # Publish is irreversible in practice (the release page becomes
      # releases/latest), so the artifact is installed and run before it ships.
      # A wheel whose console script cannot start fails here, not on a user's
      # machine (#65).
      - name: Smoke install the built wheel before publishing
        run: |
          uv venv --clear /tmp/release-smoke
          uv pip install --python /tmp/release-smoke/bin/python dist/torbox_cli-*.whl
          /tmp/release-smoke/bin/torbox --version
          /tmp/release-smoke/bin/torbox general --help

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          files: |
            dist/*
            requirements.lock.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release carries exactly the built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if scripts/check_release_assets.sh "${GITHUB_REF_NAME}"; then
            exit 0
          fi
          # A release page that is already live must not stay live after its
          # own asset check fails (#65). The tag is kept so the release can be
          # recreated once the cause is fixed.
          gh release delete "${GITHUB_REF_NAME}" --yes || true
          echo "::error::asset check failed; release ${GITHUB_REF_NAME} deleted, the tag was kept"
          exit 1
