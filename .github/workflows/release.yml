name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Needed for hatch-vcs to read tags

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          # Pinned to the version that wrote `uv.lock` (see AGENTS.md).
          version: "0.12.19"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          uv build
          # `uv build` seeds dist/ with a .gitignore; the release must not
          # publish it (issue #53).
          rm -f dist/.gitignore

      - name: Export pinned dependency requirements from lockfile
        run: uv export --frozen -o requirements.lock.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: |
            dist/*
            requirements.lock.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the release carries exactly the built artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check_release_assets.sh "${GITHUB_REF_NAME}"
