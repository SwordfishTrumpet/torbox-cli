name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check . --output-format=github

      - name: Type check with mypy
        run: uv run mypy --strict torbox

      - name: Test with pytest
        run: uv run pytest --tb=short --cov=torbox --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for hatch-vcs to read tags

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke install wheel
        run: |
          uv venv /tmp/smoke-wheel
          uv pip install --python /tmp/smoke-wheel/bin/python dist/torbox_cli-*.whl
          /tmp/smoke-wheel/bin/torbox --version
          /tmp/smoke-wheel/bin/torbox --help

      - name: Smoke install sdist
        run: |
          uv venv /tmp/smoke-sdist
          uv pip install --python /tmp/smoke-sdist/bin/python dist/torbox_cli-*.tar.gz
          /tmp/smoke-sdist/bin/torbox --version
          /tmp/smoke-sdist/bin/torbox general --help
