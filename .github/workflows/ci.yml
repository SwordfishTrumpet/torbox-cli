name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the token only needs to read the checkout. Without this the
# workflow inherits the repository default, which an owner can change later.
permissions:
  contents: read

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned: `uv.lock` is a revision-3 lockfile and `uv lock --check`
          # semantics change between uv releases (see AGENTS.md).
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check . --output-format=github

      - name: Type check with mypy
        run: uv run mypy --strict torbox

      - name: Test with pytest
        run: uv run pytest --tb=short --cov=torbox --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Needed for hatch-vcs to read tags

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          # Pinned to the version that wrote `uv.lock` (see AGENTS.md).
          version: "0.12.19"
          python-version: "3.12"

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke install wheel
        run: |
          uv venv /tmp/smoke-wheel
          uv pip install --python /tmp/smoke-wheel/bin/python dist/torbox_cli-*.whl
          /tmp/smoke-wheel/bin/torbox --version
          /tmp/smoke-wheel/bin/torbox --help

      - name: Smoke install sdist
        run: |
          uv venv /tmp/smoke-sdist
          uv pip install --python /tmp/smoke-sdist/bin/python dist/torbox_cli-*.tar.gz
          /tmp/smoke-sdist/bin/torbox --version
          /tmp/smoke-sdist/bin/torbox general --help
